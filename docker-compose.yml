services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniresolve-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://uniresolve:uniresolve_pass@postgres:5432/uniresolve_db
      - SYNC_DATABASE_URL=postgresql://uniresolve:uniresolve_pass@postgres:5432/uniresolve_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=uniresolve-proofs
      - WEB3_PROVIDER_URI=https://rpc-amoy.polygon.technology
      - CONTRACT_ADDRESS=0x99505877c445aB9C187B75c742e3f443C78c9E6D
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniresolve-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: uniresolve-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=uniresolve
      - POSTGRES_PASSWORD=uniresolve_pass
      - POSTGRES_DB=uniresolve_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: uniresolve-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: uniresolve-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: uniresolve-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
